<!-- PDF Viewer -->
<div id="pdfViewer" class="pdf-container">
    <pdf-viewer [src]="pdfSrc" (after-load-complete)="capturePDF()" style="width: 100%; height: 600px;"></pdf-viewer>
</div>

<!-- The div to be placed on the PDF -->
<div #overlayDiv class="overlay-box">
    <p>My Custom Positioned Div</p>
</div>
<!-- Dynamic Template Div (Positioned at x:50, y:100) -->
<div #workspaceDiv class="workspace-template" [style.transform]="'translate(' + dynamicX + 'px, ' + dynamicY + 'px)'">
    <div class="workspace" [style.width.px]="workspaceData.width" [style.height.px]="workspaceData.height" [style.backgroundColor]="workspaceData.backgroundColor" [style.border]="workspaceData.borderWidth + 'px solid ' + workspaceData.borderColor" [style.borderRadius.px]="workspaceData.borderRadius">

        <div *ngFor="let element of workspaceData.elements" class="template-element" [style.left.px]="element.x" [style.top.px]="element.y" [style.width.px]="element.width" [style.height.px]="element.height" [style.fontSize.px]="element.fontSize" [style.backgroundColor]="element.backgroundColor"
            [style.color]="element.fontColor">

            <span *ngIf="element.type === 'label'">{{ element.staticText }}</span>

            <img *ngIf="element.type === 'image'" [src]="element.fileUrl" class="uploaded-image" />

            <ngx-barcode *ngIf="element.type === 'barcode'" [bcValue]="element.barcodeNumber" [bcFormat]="'CODE128'" [bcWidth]="2" [bcHeight]="50">
            </ngx-barcode>
        </div>
    </div>
</div>
<!-- Download Modified PDF -->
<button (click)="generatePDF()">Download PDF with Overlay</button>
