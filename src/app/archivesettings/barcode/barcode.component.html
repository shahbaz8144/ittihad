<ul class="context-menu" *ngIf="contextMenuVisible" [style.top]="contextMenuPosition.y" [style.left]="contextMenuPosition.x">
    <li *ngIf="contextMenuTarget === 'element'" (click)="copyElement()">Copy</li>
    <li *ngIf="copiedElement" (click)="pasteElement()">Paste</li>
    <li *ngIf="contextMenuTarget === 'element'" (click)="deleteSelectedElement()">Delete</li>
    <li *ngIf="contextMenuTarget === 'element'" (click)="openPropertiesPanel()">Properties</li>
</ul>

<div class="properties-panel" *ngIf="showPropertiesPanel">
    <h3>Element Properties (ID: {{selectedElement?.id}})</h3>

    <label>Text:</label>
    <input type="text" [(ngModel)]="selectedElement!.staticText" (change)="updateSelectedElement()" />

    <label>Font Color:</label>
    <input type="color" [(ngModel)]="selectedElement!.fontColor" (change)="updateSelectedElement()" />

    <label>Font Size:</label>
    <input type="number" [(ngModel)]="selectedElement!.fontSize" (change)="updateFontSize()" min="8" max="100" />

    <label>Font Style:</label>
    <select [(ngModel)]="selectedElement!.fontStyle" (change)="updateSelectedElement()">
        <option value="normal">Normal</option>
        <option value="italic">Italic</option>
    </select>

    <label>Bold:</label>
    <select [(ngModel)]="selectedElement!.fontWeight" (change)="updateSelectedElement()">
        <option value="normal">Normal</option>
        <option value="bold">Bold</option>
    </select>

    <label>Width:</label>
    <input type="number" [(ngModel)]="selectedElement!.width" (change)="updateSelectedElement()" />

    <label>Height:</label>
    <input type="number" [(ngModel)]="selectedElement!.height" (change)="updateSelectedElement()" />

    <label>X Position:</label>
    <input type="number" [(ngModel)]="selectedElement!.x" (change)="updateSelectedElement()" />

    <label>Y Position:</label>
    <input type="number" [(ngModel)]="selectedElement!.y" (change)="updateSelectedElement()" />

    <label>Background Color:</label>
    <input type="color" [(ngModel)]="selectedElement!.backgroundColor" (change)="updateSelectedElement()" />

    <button (click)="closePropertiesPanel()">Close</button>
</div>
